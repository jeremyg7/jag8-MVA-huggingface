---
# Public analysis template. The protected sample/HPO block and output paths are
# added only in the external run directory.
analysis:
  analysisMode: PASS_ONLY
  inheritanceModes: {
    AUTOSOMAL_DOMINANT: 0.1,
    AUTOSOMAL_RECESSIVE_HOM_ALT: 0.1,
    AUTOSOMAL_RECESSIVE_COMP_HET: 1.0,
    X_DOMINANT: 0.1,
    X_RECESSIVE_HOM_ALT: 0.1,
    X_RECESSIVE_COMP_HET: 1.0,
    MITOCHONDRIAL: 0.2
  }
  frequencySources: [
    THOUSAND_GENOMES, TOPMED, UK10K,
    GNOMAD_E_AFR, GNOMAD_E_AMR, GNOMAD_E_EAS, GNOMAD_E_NFE, GNOMAD_E_SAS,
    GNOMAD_G_AFR, GNOMAD_G_AMR, GNOMAD_G_EAS, GNOMAD_G_NFE, GNOMAD_G_SAS
  ]
  pathogenicitySources: [REVEL, MVP, ALPHA_MISSENSE, SPLICE_AI]
  steps: [
    failedVariantFilter: {},
    variantEffectFilter: {
      remove: [
        FIVE_PRIME_UTR_EXON_VARIANT,
        FIVE_PRIME_UTR_INTRON_VARIANT,
        THREE_PRIME_UTR_EXON_VARIANT,
        THREE_PRIME_UTR_INTRON_VARIANT,
        NON_CODING_TRANSCRIPT_EXON_VARIANT,
        NON_CODING_TRANSCRIPT_INTRON_VARIANT,
        CODING_TRANSCRIPT_INTRON_VARIANT,
        UPSTREAM_GENE_VARIANT,
        DOWNSTREAM_GENE_VARIANT,
        INTERGENIC_VARIANT,
        REGULATORY_REGION_VARIANT
      ]
    },
    frequencyFilter: {maxFrequency: 1.0},
    pathogenicityFilter: {keepNonPathogenic: true},
    inheritanceFilter: {},
    omimPrioritiser: {},
    hiPhivePrioritiser: {}
  ]
outputOptions:
  outputContributingVariantsOnly: false
  numGenes: 100
  outputFileName: unbiased
  outputFormats: [HTML, TSV_GENE, TSV_VARIANT]
